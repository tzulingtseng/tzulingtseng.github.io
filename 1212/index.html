<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>資料分析工具</title>

    <style>
        :root {
            --bg: #1f2128;
            --panel: rgba(255, 255, 255, 0.07);
            --panel2: rgba(255, 255, 255, 0.06);
            --ink: #e0e0e0;
            --muted: #b0bec5;
            --accent: #607d8b;
            --btn: #394a57;
            --btnHover: #4c6371;
            --btn2: #455a64;
            --btn2Hover: #607d8b;
            --danger: #5d2e2e;
            --dangerHover: #7a3b3b;

            --cellSize: 28px;
            /* 桌機預設 */
            --cellFont: 13px;
            --gap: 18px;
            --radius: 14px;
        }

        /* 手機：放大格子 & 字 */
        @media (max-width: 900px) {
            :root {
                --cellSize: 32px;
                --cellFont: 14px;
                --gap: 14px;
            }
        }

        @media (max-width: 420px) {
            :root {
                --cellSize: 34px;
                --cellFont: 14px;
            }
        }

        body {
            margin: 0;
            padding: 24px;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            background: var(--bg);
            color: var(--ink);
            font-family: "Noto Sans TC", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }

        @media (max-width:900px) {
            body {
                padding: 16px;
                padding-bottom: max(16px, env(safe-area-inset-bottom));
            }
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--panel);
            padding: 24px;
            border-radius: var(--radius);
        }

        @media (max-width:900px) {
            .app {
                padding: 16px;
                border-radius: 12px;
            }
        }

        h1 {
            text-align: center;
            margin: 0 0 16px 0;
            font-size: 22px;
            letter-spacing: .5px;
        }

        @media (max-width:900px) {
            h1 {
                font-size: 20px;
                margin-bottom: 12px;
            }
        }

        /* Layout：桌機左右，手機上下（輸入在上、路紙在下） */
        .layout {
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: var(--gap);
            align-items: start;
        }

        @media (max-width:900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .right {
                order: -1;
            }

            /* 手機：右側（輸入）放上面 */
        }

        .section-title {
            margin-top: 16px;
            border-left: 4px solid var(--accent);
            padding-left: 8px;
            font-weight: 700;
            font-size: 15px;
            color: #cfd8dc;
        }

        @media (max-width:900px) {
            .section-title {
                margin-top: 12px;
            }
        }

        input {
            width: 100%;
            margin-top: 8px;
            padding: 12px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: #2a2c33;
            color: #fff;
            font-size: 16px;
            /* 手機更好輸入 */
            outline: none;
        }

        .hint {
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.55;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 12px 12px;
            border: none;
            border-radius: 10px;
            background: var(--btn);
            color: #fff;
            cursor: pointer;
            font-size: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: var(--btnHover);
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        @media (max-width:420px) {
            .btn-row {
                grid-template-columns: 1fr;
            }
        }

        button.undo {
            background: var(--btn2);
        }

        button.undo:hover {
            background: var(--btn2Hover);
        }

        button.danger {
            background: var(--danger);
        }

        button.danger:hover {
            background: var(--dangerHover);
        }

        .result {
            margin-top: 12px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            line-height: 1.75;
            font-size: 14px;
        }

        .road-block {
            margin-bottom: 14px;
            background: var(--panel2);
            padding: 10px;
            border-radius: 12px;
        }

        .road-title {
            font-size: 14px;
            margin-bottom: 6px;
            color: #cfd8dc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: #cfd8dc;
            white-space: nowrap;
        }

        .road-sub {
            font-size: 12px;
            color: #90a4ae;
            margin: 0 0 8px 0;
            line-height: 1.5;
        }

        /* 路紙可滑動（手機） */
        .road-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px;
            border-radius: 10px;
        }

        .road-table {
            border-collapse: collapse;
        }

        .road-table td {
            width: var(--cellSize);
            height: var(--cellSize);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.17);
            font-size: var(--cellFont);
            color: #fff;
            user-select: none;
        }

        /* Normal colors */
        .cell-banker {
            background: rgba(198, 40, 40, 0.75);
        }

        /* 莊 */
        .cell-player {
            background: rgba(33, 150, 243, 0.75);
        }

        /* 閒 */
        .cell-tie {
            background: rgba(56, 142, 60, 0.75);
        }

        /* 和 */
        .cell-yes {
            background: rgba(67, 160, 71, 0.75);
        }

        /* 正 */
        .cell-fail {
            background: rgba(211, 47, 47, 0.75);
        }

        /* 反 */
        .cell-neutral {
            background: rgba(120, 144, 156, 0.35);
            color: rgba(255, 255, 255, .85);
        }

        /* 中性 */
        .cell-none {
            opacity: .25;
        }

        /* ===== Stealth Mode ===== */
        body.stealth .cell-banker,
        body.stealth .cell-player,
        body.stealth .cell-tie {
            background: rgba(120, 144, 156, 0.35) !important;
            color: #e0e0e0 !important;
        }

        body.stealth .cell-yes,
        body.stealth .cell-fail {
            background: rgba(96, 125, 139, 0.45) !important;
            color: #e0e0e0 !important;
        }

        body.stealth .badge {
            background: rgba(96, 125, 139, 0.25);
            color: #cfd8dc;
        }
    </style>
</head>

<body>
    <div class="app">
        <h1 id="appTitle">資料分析工具</h1>

        <div class="layout">
            <!-- Left: roads -->
            <div class="left">
                <div class="road-block">
                    <div class="road-title">
                        <span id="t_actual">資料序列 A</span>
                        <span class="badge" id="modeBadge">一般顯示</span>
                    </div>
                    <div class="road-wrapper">
                        <table class="road-table">
                            <tbody id="actualRoad"></tbody>
                        </table>
                    </div>
                </div>

                <div class="road-block">
                    <div class="road-title">
                        <span id="t_predict">推導結果</span>
                        <span class="badge" id="hintBadge">第 1 格空白</span>
                    </div>
                    <p class="road-sub" id="sub_predict">
                        第 1 格固定空白；第 N 格＝第 N 局建議（由第 N-1 局算出）；最後一格＝下一局
                    </p>
                    <div class="road-wrapper">
                        <table class="road-table">
                            <tbody id="predictRoad"></tbody>
                        </table>
                    </div>
                </div>

                <div class="road-block">
                    <div class="road-title">
                        <span id="t_hit">驗證狀態</span>
                        <span class="badge" id="hitBadge">第 2 格起</span>
                    </div>
                    <p class="road-sub" id="sub_hit">
                        第 1 格固定空白；第 N 格（N≥2）＝用第 N 局實際驗證第 N 局建議（遇到和顯示「和」）
                    </p>
                    <div class="road-wrapper">
                        <table class="road-table">
                            <tbody id="hitRoad"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Right: controls (mobile goes top) -->
            <div class="right">
                <div class="section-title" id="i_player">輸入欄位 A</div>
                <input id="playerInput" placeholder="A,5,K / A 5 K / A5K / A-5/K" inputmode="text" />

                <div class="section-title" id="i_banker">輸入欄位 B</div>
                <input id="bankerInput" placeholder="2,8,J / 2 8 J / 28J" inputmode="text" />

                <div class="hint" id="hintText">
                    ✔ 支援任意分隔/無分隔輸入（大小寫皆可）<br>
                    ✔ 推導結果對應下一步；驗證狀態從第 2 筆開始<br>
                    ✔ ✅ 若本次為 C（平），驗證狀態該筆顯示 C
                </div>

                <button id="calcBtn">更新序列 & 推導下一步</button>

                <div class="btn-row">
                    <button id="undoBtn" class="undo">回退上一筆</button>
                    <button id="stealthBtn" class="undo" title="快捷鍵：Esc 切換">切換顯示模式</button>
                </div>

                <button id="clearBtn" class="danger">清空本次資料</button>

                <div class="result" id="result">請輸入後按計算。</div>
            </div>
        </div>
    </div>

    <script>
        /* ===== localStorage keys（v8：手機版UI） ===== */
        const LS_ACTUAL = "baccarat_actual_v8";
        const LS_PREDICT = "baccarat_predict_v8";
        const LS_HIT = "baccarat_hit_v8";
        const LS_STEALTH = "baccarat_stealth_v8";

        const $ = (id) => document.getElementById(id);

        /* ===== Stealth state ===== */
        let stealthMode = (localStorage.getItem(LS_STEALTH) === "1");

        function persistStealth() {
            localStorage.setItem(LS_STEALTH, stealthMode ? "1" : "0");
        }

        function applyStealthUI() {
            document.body.classList.toggle("stealth", stealthMode);
            $("modeBadge").textContent = stealthMode ? "隱蔽顯示" : "一般顯示";
            document.title = stealthMode ? "資料分析工具" : "工具";
            $("appTitle").textContent = stealthMode ? "資料分析工具" : "工具";

            $("t_actual").textContent = stealthMode ? "資料序列 A" : "實際開出路紙";
            $("t_predict").textContent = stealthMode ? "推導結果" : "算牌建議路紙（預測下一局）";
            $("t_hit").textContent = stealthMode ? "驗證狀態" : "預測成功 / 失敗路紙（驗證上一局預測）";

            $("i_player").textContent = stealthMode ? "輸入欄位 A" : "閒家牌面";
            $("i_banker").textContent = stealthMode ? "輸入欄位 B" : "莊家牌面";

            $("calcBtn").textContent = stealthMode ? "更新序列 & 推導下一步" : "計算本局結果 & 產生下一局建議";
            $("undoBtn").textContent = stealthMode ? "回退上一筆" : "悔一步（回退上一局）";
            $("clearBtn").textContent = stealthMode ? "清空本次資料" : "換房 / 清空牌局";

            $("sub_predict").textContent = stealthMode
                ? "第 1 格固定空白；第 N 格＝第 N 筆推導（由第 N-1 筆算出）；最後一格＝下一步"
                : "第 1 格固定空白；第 N 格＝第 N 局建議（由第 N-1 局算出）；最後一格＝下一局";

            $("sub_hit").textContent = stealthMode
                ? "第 1 格固定空白；第 N 格（N≥2）＝用第 N 筆實際驗證第 N 筆推導（遇到 C 顯示 C）"
                : "第 1 格固定空白；第 N 格（N≥2）＝用第 N 局實際驗證第 N 局建議（遇到和顯示「和」）";

            $("hintText").innerHTML = stealthMode
                ? "✔ 支援任意分隔/無分隔輸入（大小寫皆可）<br>✔ 推導結果對應下一步；驗證狀態從第 2 筆開始<br>✔ ✅ 若本次為 C（平），驗證狀態該筆顯示 C"
                : "✔ A=1，2–9 為點數，10/J/Q/K=0（公牌）<br>✔ 支援任意分隔/無分隔輸入（大小寫皆可）<br>✔ 「算牌建議」對應下一局；「正/反」會從第 2 局開始出現<br>✔ ✅ 遇到「和」：正/反路紙該局顯示「和」";
        }

        /* ===== Parser：超自由輸入 ===== */
        function parseCardList(str) {
            if (!str) return [];
            str = str.toUpperCase().replace(/[^A-Z0-9]/g, " ").replace(/\s+/g, " ").trim();
            if (!str) return [];
            const out = [];
            str.split(" ").forEach((t) => {
                for (let i = 0; i < t.length; i++) {
                    if (t[i] === "1" && t[i + 1] === "0") { out.push("10"); i++; }
                    else if (/[A-Z]/.test(t[i])) out.push(t[i]);
                    else if (/[2-9]/.test(t[i])) out.push(t[i]);
                }
            });
            return out;
        }

        function getCardInfo(c) {
            if (c === "A") return { p: 1, pub: false };
            if (["10", "J", "Q", "K", "T"].includes(c)) return { p: 0, pub: true };
            const n = parseInt(c, 10);
            if (!isNaN(n) && n >= 2 && n <= 9) return { p: n, pub: false };
            return null;
        }

        /* ===== State load ===== */
        let actual = JSON.parse(localStorage.getItem(LS_ACTUAL) || "[]");    // 'P'|'B'|'T'
        let predict = JSON.parse(localStorage.getItem(LS_PREDICT) || "[]");  // [null, ...] 'P'|'B'|'U'
        let hit = JSON.parse(localStorage.getItem(LS_HIT) || "[]");          // [null, ...] 'Y'|'F'|'T'|null

        function save() {
            localStorage.setItem(LS_ACTUAL, JSON.stringify(actual));
            localStorage.setItem(LS_PREDICT, JSON.stringify(predict));
            localStorage.setItem(LS_HIT, JSON.stringify(hit));
        }

        /* ===== Labels ===== */
        const mapNormal = { B: "莊", P: "閒", T: "和", Y: "正", F: "反", U: "中" };
        const mapStealth = { B: "A", P: "B", T: "C", Y: "✓", F: "✕", U: "·" };

        /* ===== Render ===== */
        function drawRoad(id, arr) {
            const tb = $(id);
            tb.innerHTML = "";
            const rows = 6;
            const cols = Math.max(18, Math.ceil(arr.length / rows));

            for (let r = 0; r < rows; r++) {
                const tr = document.createElement("tr");
                for (let c = 0; c < cols; c++) {
                    const idx = c * rows + r;
                    const v = arr[idx];
                    const td = document.createElement("td");

                    if (v === "B") td.className = "cell-banker";
                    else if (v === "P") td.className = "cell-player";
                    else if (v === "T") td.className = "cell-tie";
                    else if (v === "U") td.className = "cell-neutral";
                    else if (v === "Y") td.className = "cell-yes";
                    else if (v === "F") td.className = "cell-fail";
                    else td.className = "cell-none";

                    const label = stealthMode ? mapStealth[v] : mapNormal[v];
                    td.textContent = label || "";

                    tr.appendChild(td);
                }
                tb.appendChild(tr);
            }
        }

        function drawAll() {
            drawRoad("actualRoad", actual);
            drawRoad("predictRoad", predict);
            drawRoad("hitRoad", hit);
        }

        /* ===== Normalize lengths ===== */
        function normalize() {
            if (!Array.isArray(actual)) actual = [];
            if (!Array.isArray(predict)) predict = [];
            if (!Array.isArray(hit)) hit = [];

            if (predict.length === 0) predict.push(null);
            if (hit.length === 0) hit.push(null);

            const N = actual.length;

            while (predict.length < N + 1) predict.push(null);
            if (predict.length > N + 1) predict = predict.slice(0, N + 1);

            while (hit.length < N) hit.push(null);
            if (hit.length > N) hit = hit.slice(0, N);

            save();
        }

        /* ===== compute round ===== */
        function computeRound(playerStr, bankerStr) {
            const pTokens = parseCardList(playerStr);
            const bTokens = parseCardList(bankerStr);

            const errors = [];
            let pSum = 0, bSum = 0, publicCount = 0;

            if (pTokens.length < 2) errors.push("閒家至少 2 張");
            if (bTokens.length < 2) errors.push("莊家至少 2 張");

            pTokens.forEach((c) => {
                const info = getCardInfo(c);
                if (!info) errors.push(`閒牌「${c}」無效`);
                else { pSum += info.p; if (info.pub) publicCount++; }
            });

            bTokens.forEach((c) => {
                const info = getCardInfo(c);
                if (!info) errors.push(`莊牌「${c}」無效`);
                else { bSum += info.p; if (info.pub) publicCount++; }
            });

            const pt = pSum % 10;
            const bt = bSum % 10;

            const act = pt > bt ? "P" : bt > pt ? "B" : "T";

            // 你的算牌：差值 × 公牌奇偶
            const diff = pt - bt;
            const sign = diff > 0 ? 1 : diff < 0 ? -1 : 0;
            const final = sign * (publicCount % 2 === 0 ? 1 : -1);
            const predNext = final > 0 ? "P" : final < 0 ? "B" : "U";

            return { errors, pt, bt, publicCount, act, predNext };
        }

        /* ===== Main ===== */
        $("calcBtn").onclick = () => {
            const r = computeRound($("playerInput").value, $("bankerInput").value);
            if (r.errors.length) {
                $("result").innerHTML = "<b>輸入有誤：</b><br>" + r.errors.join("<br>");
                return;
            }

            actual.push(r.act);
            normalize();

            const n = actual.length;              // 1-based
            const predForThisRound = predict[n - 1];

            // hit：第1格空白；第2局起才有
            if (n >= 2) {
                if (r.act === "T") {
                    hit[n - 1] = "T";                 // ✅ 和：顯示和
                } else if (predForThisRound === "P" || predForThisRound === "B") {
                    hit[n - 1] = (predForThisRound === r.act) ? "Y" : "F";
                } else {
                    hit[n - 1] = null;
                }
            }

            predict[n] = r.predNext;

            save();
            drawAll();

            const actText = stealthMode
                ? (r.act === "P" ? "B" : r.act === "B" ? "A" : "C")
                : (r.act === "P" ? "閒" : r.act === "B" ? "莊" : "和");

            const nextText = stealthMode
                ? (r.predNext === "P" ? "下一步：B" : r.predNext === "B" ? "下一步：A" : "下一步：·")
                : (r.predNext === "P" ? "下【閒】" : r.predNext === "B" ? "下【莊】" : "觀望（中性）");

            const verifyText = (() => {
                if (n === 1) return stealthMode ? "驗證：—" : "本局驗證：<span style='color:#b0bec5'>無（第一局）</span>";
                if (r.act === "T") return stealthMode ? "驗證：C" : "本局驗證：<span style='color:#81c784'>和</span>";
                const hv = hit[n - 1];
                if (hv === "Y") return stealthMode ? "驗證：✓" : "本局驗證：<b style='color:#66bb6a'>正</b>";
                if (hv === "F") return stealthMode ? "驗證：✕" : "本局驗證：<b style='color:#ef5350'>反</b>";
                return stealthMode ? "驗證：·" : "本局驗證：<span style='color:#b0bec5'>無（中性/無建議）</span>";
            })();

            $("result").innerHTML = stealthMode
                ? `本次結果：<b>${actText}</b>（A:${r.bt} / B:${r.pt}）<br>${verifyText}<br><br>👉 ${nextText}`
                : `本局實際：<b>${actText}</b>（閒 ${r.pt} / 莊 ${r.bt}，公牌 ${r.publicCount}）<br>${verifyText}<br><br>👉 下一局建議：<b>${nextText}</b>`;
        };

        /* ===== Undo ===== */
        $("undoBtn").onclick = () => {
            if (actual.length === 0) { alert("目前沒有可回退的資料"); return; }
            if (!confirm(stealthMode ? "確定要回退上一筆？" : "確定要回退上一局？")) return;

            const n = actual.length;

            if (predict.length > n) predict[n] = null;
            if (n >= 2 && hit.length >= n) hit[n - 1] = null;

            actual.pop();
            normalize();

            drawAll();
            $("result").innerHTML = stealthMode ? "已回退上一筆，請重新更新。" : "已回退上一局，請修正牌面後重新計算。";
        };

        /* ===== Clear ===== */
        $("clearBtn").onclick = () => {
            if (!confirm(stealthMode ? "確定清空所有資料？" : "確定換房並清空所有牌局？")) return;

            actual = [];
            predict = [null];
            hit = [null];

            save();
            drawAll();
            $("result").innerHTML = stealthMode ? "已清空資料。" : "已清空牌局，請重新開始。";
        };

        /* ===== Stealth Toggle (Button + ESC) ===== */
        function toggleStealth() {
            stealthMode = !stealthMode;
            persistStealth();
            applyStealthUI();
            drawAll();
        }
        $("stealthBtn").onclick = toggleStealth;

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") toggleStealth();
        });

        /* Init */
        normalize();
        applyStealthUI();
        drawAll();
    </script>
</body>

</html>
