<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>最佳平衡版（連正/連反）</title>
    <style>
        :root {
            --bg: #0b1020;
            --card: #111a33;
            --txt: #eaf0ff;
            --mut: #9fb0d8;
            --bd: rgba(229, 231, 235, .14);
            --btn: #2b4cff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
            background: linear-gradient(180deg, #070a14, #0b1020 35%, #070a14);
            color: var(--txt);
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 14px;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 10px;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .panel {
            background: rgba(17, 26, 51, .9);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 12px;
        }

        .left {
            flex: 1 1 360px;
            min-width: 320px;
        }

        .right {
            flex: 1 1 560px;
            min-width: 320px;
        }

        textarea {
            width: 100%;
            min-height: 220px;
            resize: vertical;
            background: #0a122a;
            color: var(--txt);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 10px;
            line-height: 1.5;
            font-size: 14px;
            outline: none;
        }

        .btns {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            background: var(--btn);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 800;
            cursor: pointer;
        }

        button.secondary {
            background: #223055;
            color: #d9e2ff;
            border: 1px solid var(--bd);
        }

        button.danger {
            background: #3a2340;
            border: 1px solid rgba(255, 154, 168, .35);
            color: #ffd1d8;
        }

        .hint {
            color: var(--mut);
            font-size: 12px;
            margin-top: 8px;
            line-height: 1.4;
        }

        .summary {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            color: var(--mut);
            font-size: 13px;
        }

        .pill {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--bd);
            background: rgba(10, 18, 42, .7);
            white-space: nowrap;
        }

        .tableWrap {
            overflow: auto;
            max-height: 560px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            min-width: 760px;
        }

        th,
        td {
            border-bottom: 1px solid var(--bd);
            padding: 8px 6px;
            vertical-align: top;
        }

        th {
            text-align: left;
            color: #cfe0ff;
            font-weight: 900;
            position: sticky;
            top: 0;
            background: rgba(17, 26, 51, .96);
            z-index: 2;
        }

        .ok {
            color: #8dffb0;
            font-weight: 900;
        }

        .bad {
            color: #ff9aa8;
            font-weight: 900;
        }

        .tie {
            color: #ffd37a;
            font-weight: 900;
        }

        .mut {
            color: var(--mut);
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        @media (max-width: 820px) {
            .wrap {
                padding: 10px;
            }

            h1 {
                font-size: 15px;
            }

            .row {
                gap: 10px;
            }

            .panel {
                padding: 10px;
                border-radius: 12px;
            }

            textarea {
                min-height: 190px;
                font-size: 14px;
            }

            .btns {
                gap: 8px;
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .btns button {
                width: 100%;
                padding: 10px 12px;
            }

            .btns button.wide {
                grid-column: 1 / -1;
            }

            .tableWrap {
                max-height: 420px;
            }

            table {
                min-width: 900px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>最佳平衡版（只抓連正 / 連反）</h1>

        <div class="row">
            <div class="panel left">
                <textarea id="input" spellcheck="false" placeholder="每行一局（這裡只放『新一批』），例如：
35 / 79
46 / 38
5$4 / 66
59$ 6$"></textarea>

                <div class="btns">
                    <button id="run" class="wide">計算（追加到表格＋自動入帳）</button>
                    <button id="demo" class="secondary">示範10局</button>
                    <button id="undo" class="secondary">撤銷上一筆</button>
                    <button id="clear" class="secondary">清空輸入</button>
                    <button id="resetLedger" class="danger wide">清空總帳/表格</button>
                </div>

                <div class="hint">
                    牌面：1=A=1；$=10/J/Q/K=0 且算公牌數。<br />
                    本局實際：mod10 比大小。方向：D=(閒總和-莊總和)×公牌奇偶（$總數奇=-1，偶/0=+1）。<br />
                    狀態：只抓連正/連反（2→L1，3→L2，4+→L3；和不推進）。<br />
                    下注：狀態≥L1 且方向≠不下 → 押下一局（均注1；和退回0）。<br />
                    ★ 每按一次「計算」會把本次新一批追加到表格並入帳；「撤銷」可回退上一批（含表格與狀態）。
                </div>

                <div class="summary" id="summary"></div>
                <div class="summary" id="ledgerSummary"></div>
            </div>

            <div class="panel right">
                <div class="tableWrap">
                    <table id="tbl">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>牌面</th>
                                <th>本局實際</th>
                                <th>驗證</th>
                                <th>狀態</th>
                                <th>D / $ / 奇偶</th>
                                <th>下一局方向</th>
                                <th>本局下注</th>
                                <th>本局盈虧</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const q = s => document.querySelector(s);

            const LS_LEDGER = 'bacc_ledger_auto_v3';
            const LS_STACK = 'bacc_commit_stack_v3';

            function defaultLedger() {
                return { commits: 0, hands: 0, bets: 0, win: 0, lose: 0, tie: 0, pnl: 0 };
            }
            function loadJSON(key, fallback) {
                try {
                    const v = localStorage.getItem(key);
                    return v ? JSON.parse(v) : fallback;
                } catch { return fallback; }
            }
            function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

            function loadLedger() {
                const L = loadJSON(LS_LEDGER, null);
                return L && typeof L === 'object' ? { ...defaultLedger(), ...L } : defaultLedger();
            }
            function saveLedger(L) { saveJSON(LS_LEDGER, L); }

            function loadStack() {
                const s = loadJSON(LS_STACK, []);
                return Array.isArray(s) ? s : [];
            }
            function saveStack(stack) { saveJSON(LS_STACK, stack); }

            function parseLine(line) {
                const s = line.trim(); if (!s) return null;
                let parts = s.replace(/\s+/g, ' ').split('/').map(x => x.trim()).filter(Boolean);
                if (parts.length !== 2) {
                    const p2 = s.split(' ').filter(Boolean);
                    if (p2.length >= 2) parts = [p2[0], p2[1]];
                }
                if (parts.length !== 2) return null;
                return { p: parts[0], b: parts[1], raw: `${parts[0]} / ${parts[1]}` };
            }
            const cardVal = c => (c === '$' ? 0 : (c >= '0' && c <= '9' ? +c : 0));
            const sumRaw = s => [...s].reduce((a, c) => a + cardVal(c), 0);
            const count$ = s => [...s].filter(c => c === '$').length;
            const mod10 = n => ((n % 10) + 10) % 10;

            function actual(p, b) {
                const pr = sumRaw(p), br = sumRaw(b);
                const pm = mod10(pr), bm = mod10(br);
                if (pm > bm) return { who: '閒', pm, bm };
                if (bm > pm) return { who: '莊', pm, bm };
                return { who: '和', pm, bm };
            }
            function nextDir(p, b) {
                const pr = sumRaw(p), br = sumRaw(b);
                const D = pr - br;
                const dollars = count$(p) + count$(b);
                const parity = (dollars % 2 ? -1 : 1);
                const v = D * parity;
                return { D, dollars, parity, dir: v > 0 ? '閒' : (v < 0 ? '莊' : '不下'), pr, br };
            }
            const stateFrom = n => n >= 4 ? 'L3' : n === 3 ? 'L2' : n === 2 ? 'L1' : 'L0';
            const verifyClass = v => v === '正' ? 'ok' : v === '反' ? 'bad' : v === '和' ? 'tie' : 'mut';

            // runtime state (persist across runs)
            const runtime = {
                handIndex: 0,
                prevDir: null,
                streakRes: null,
                streak: 0,
                prevBet: { place: false, side: '不下' },
            };

            function snapshotState() { return JSON.parse(JSON.stringify(runtime)); }
            function restoreState(s) {
                runtime.handIndex = s.handIndex;
                runtime.prevDir = s.prevDir;
                runtime.streakRes = s.streakRes;
                runtime.streak = s.streak;
                runtime.prevBet = s.prevBet;
            }

            function renderLedger() {
                const L = loadLedger(), el = q('#ledgerSummary'); el.innerHTML = '';
                const pill = t => { const d = document.createElement('div'); d.className = 'pill'; d.textContent = t; el.appendChild(d); };
                pill(`總帳｜批次：${L.commits}`);
                pill(`總帳｜局數：${L.hands}`);
                pill(`總帳｜下注：${L.bets}`);
                pill(`總帳｜勝/負/和：${L.win}/${L.lose}/${L.tie}`);
                pill(`總帳｜盈虧：${L.pnl > 0 ? '+' : ''}${L.pnl}`);
            }

            function renderSummary(handsCount, bets, win, lose, tie, total) {
                const s = q('#summary'); s.innerHTML = '';
                const pill = t => { const d = document.createElement('div'); d.className = 'pill'; d.textContent = t; s.appendChild(d); };
                pill(`本次新增局數：${handsCount}`);
                pill(`本次新增下注：${bets}`);
                pill(`本次新增勝/負/和：${win}/${lose}/${tie}`);
                pill(`本次新增盈虧：${total > 0 ? '+' : ''}${total}`);
            }

            function computeAndAppend(hands) {
                const tb = q('#tbl tbody');
                let total = 0, bets = 0, win = 0, lose = 0, tie = 0;
                let rowsAppended = 0;

                hands.forEach((h) => {
                    runtime.handIndex += 1;

                    const act = actual(h.p, h.b);

                    let verify = '—';
                    if (runtime.prevDir && runtime.prevDir !== '不下' && act.who !== '和') {
                        verify = (runtime.prevDir === act.who) ? '正' : '反';
                    } else if (runtime.prevDir && runtime.prevDir !== '不下' && act.who === '和') {
                        verify = '和';
                    } else if (act.who === '和') {
                        verify = '和';
                    }

                    if (verify === '正' || verify === '反') {
                        if (runtime.streakRes === verify) runtime.streak += 1;
                        else { runtime.streakRes = verify; runtime.streak = 1; }
                    }
                    const state = stateFrom(runtime.streak);

                    const nx = nextDir(h.p, h.b);

                    let pnl = 0, betTxt = '不下';
                    if (runtime.prevBet.place) {
                        bets++; betTxt = `下${runtime.prevBet.side}`;
                        if (act.who === '和') { tie++; pnl = 0; }
                        else if (act.who === runtime.prevBet.side) { win++; pnl = 1; }
                        else { lose++; pnl = -1; }
                        total += pnl;
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
        <td class="mono">${runtime.handIndex}</td>
        <td class="mono">${h.raw}</td>
        <td class="mono">${act.who} <span class="mut">(${act.pm}-${act.bm})</span></td>
        <td class="${verifyClass(verify)} mono">${verify}</td>
        <td class="mono">${state}</td>
        <td class="mono">D=${nx.pr}−${nx.br}=${nx.D}｜$=${nx.dollars}｜${nx.parity > 0 ? '+1' : '−1'}</td>
        <td class="mono">${nx.dir}</td>
        <td class="mono">${betTxt}</td>
        <td class="mono ${pnl > 0 ? 'ok' : pnl < 0 ? 'bad' : 'mut'}">${pnl > 0 ? '+' : ''}${pnl}</td>
      `;
                    tb.appendChild(tr);
                    rowsAppended += 1;

                    runtime.prevDir = nx.dir;
                    runtime.prevBet = { place: (state !== 'L0' && nx.dir !== '不下'), side: nx.dir };
                });

                return { handsCount: hands.length, bets, win, lose, tie, total, rowsAppended };
            }

            function commitToLedger(delta, stateBefore, stateAfter, rowsAppended) {
                const stack = loadStack();
                stack.push({ delta, rowsAppended, stateBefore, stateAfter });
                saveStack(stack);

                const L = loadLedger();
                L.commits += 1;
                L.hands += delta.hands;
                L.bets += delta.bets;
                L.win += delta.win;
                L.lose += delta.lose;
                L.tie += delta.tie;
                L.pnl += delta.pnl;
                saveLedger(L);
            }

            function undoLast() {
                const stack = loadStack();
                if (stack.length === 0) { alert('沒有可撤銷的紀錄'); return; }
                const last = stack.pop();
                saveStack(stack);

                const L = loadLedger();
                L.commits = Math.max(0, L.commits - 1);
                L.hands = Math.max(0, L.hands - last.delta.hands);
                L.bets = Math.max(0, L.bets - last.delta.bets);
                L.win = Math.max(0, L.win - last.delta.win);
                L.lose = Math.max(0, L.lose - last.delta.lose);
                L.tie = Math.max(0, L.tie - last.delta.tie);
                L.pnl = L.pnl - last.delta.pnl;
                saveLedger(L);

                const tb = q('#tbl tbody');
                for (let i = 0; i < last.rowsAppended; i++) {
                    if (tb.lastElementChild) tb.removeChild(tb.lastElementChild);
                }

                restoreState(last.stateBefore);
                renderLedger();
            }

            function run() {
                const rawLines = q('#input').value.split('\n').map(l => l.trim()).filter(Boolean);
                const hands = rawLines.map(parseLine).filter(Boolean);

                if (hands.length === 0) { renderLedger(); return; }

                const stateBefore = snapshotState();
                const res = computeAndAppend(hands);
                const stateAfter = snapshotState();

                renderSummary(res.handsCount, res.bets, res.win, res.lose, res.tie, res.total);

                commitToLedger({
                    hands: res.handsCount,
                    bets: res.bets,
                    win: res.win,
                    lose: res.lose,
                    tie: res.tie,
                    pnl: res.total
                }, stateBefore, stateAfter, res.rowsAppended);

                renderLedger();

                // ✅ 算完自動清輸入（只清 textarea）
                q('#input').value = '';
            }

            q('#run').addEventListener('click', run);
            q('#demo').addEventListener('click', () => {
                q('#input').value = [
                    '24 / 57', '3$8 / 46', '79 / 28', '5$4 / 66', '18 / 9$',
                    '47 / 3$6', '2$5 / 89', '6$ / 24', '59 / 7$2', '8$1 / 34'
                ].join('\n');
            });
            q('#undo').addEventListener('click', undoLast);

            // 清空輸入：只清 textarea（不清表格、不動紀錄）
            q('#clear').addEventListener('click', () => { q('#input').value = ''; });

            q('#resetLedger').addEventListener('click', () => {
                if (!confirm('確定清空：總帳 + 撤銷紀錄 + 表格 + 狀態？')) return;
                localStorage.removeItem(LS_LEDGER);
                localStorage.removeItem(LS_STACK);
                q('#tbl tbody').innerHTML = '';
                q('#summary').innerHTML = '';
                runtime.handIndex = 0;
                runtime.prevDir = null;
                runtime.streakRes = null;
                runtime.streak = 0;
                runtime.prevBet = { place: false, side: '不下' };
                renderLedger();
            });

            renderLedger();
        })();
    </script>
</body>

</html>
